<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a10">
    <title>Assistente IA</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <!-- Estilos (ordem importa) -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/content.css">
<body>

    <div class="aurora"></div>
    <div id="toast"></div>

    <!-- HEADER -->
    <header class="header">
        <div class="header-brand">
            <div class="brand-logo">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <div>
                <h1 class="brand-title">Assistente IA</h1>
                <div class="brand-status">
                    <span id="connection-dot" class="status-dot wait"></span>
                    <span id="connection-text">Conectando...</span>
                </div>
            </div>
        </div>

        <div class="header-actions">
            <div class="pill-wrapper pill">
                <i class="fa-solid fa-microchip microchip"></i>
                <select id="provider-select">
                    <option value="">Carregando...</option>
                </select>
                <i class="fa-solid fa-chevron-down chevron"></i>
            </div>
            <button onclick="resetSession()" title="Nova conversa" class="icon-btn">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <main>

        <!-- FEED DE MENSAGENS -->
        <div id="chat-messages" class="custom-scrollbar">
            <div class="empty-state fade-in">
                <div class="empty-icon-wrap">
                    <div class="empty-icon-glow"></div>
                    <div class="empty-icon">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                </div>
                <h2 class="empty-title">Como posso ajudar?</h2>
                <p class="empty-subtitle">
                    Envie uma mensagem para conversar com o modelo configurado no seu backend.
                </p>
                <div class="chips">
                    <button class="chip" data-p="Explique de forma simples como funciona uma rede neural." onclick="usePrompt(this.dataset.p)">
                        <i class="fa-solid fa-brain"></i>Explicar um conceito
                    </button>
                    <button class="chip" data-p="Me ajude a escrever um e-mail profissional e objetivo." onclick="usePrompt(this.dataset.p)">
                        <i class="fa-solid fa-paper-plane"></i>Escrever um e-mail
                    </button>
                    <button class="chip" data-p="Faça um brainstorm com 10 ideias criativas para um projeto pessoal." onclick="usePrompt(this.dataset.p)">
                        <i class="fa-solid fa-lightbulb"></i>Brainstorm de ideias
                    </button>
                </div>
            </div>
        </div>

        <!-- INPUT FIXO NA BASE -->
        <div class="input-area">
            <div class="fade-bottom"></div>
            <form id="chat-form" class="composer">
                <textarea id="user-input" rows="1" placeholder="Envie uma mensagem..." class="custom-scrollbar"
                    onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); document.getElementById('chat-form').requestSubmit(); }"
                    oninput="autoResize(this)"></textarea>
                <button type="submit" id="send-btn" disabled class="send-btn">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </form>
            <p class="help-text"><kbd>Enter</kbd> enviar &nbsp;·&nbsp; <kbd>Shift</kbd> + <kbd>Enter</kbd> nova linha</p>
        </div>
    </main>

    <!-- SCRIPTS SEPARADOS -->
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
